[SERVICE]
    Flush               5
    Daemon              Off
    Log_Level           info
    storage.path        /fluent-bit/storage
    storage.sync        normal
    storage.checksum    off

    Parsers_File        parsers.conf

# UmbrelOS systemd journal
[INPUT]
    Name                systemd
    Tag                 umbrel.systemd
    Path                /var/log/journal
    Read_From_Tail      True

# Docker container logs
[INPUT]
    Name                tail
    Tag                 umbrel.docker
    Path                /var/lib/docker/containers/*/*-json.log
    Parser              docker_json
    DB                  /fluent-bit/storage/docker-state.db
    Mem_Buf_Limit       50MB
    Skip_Long_Lines     On
    Refresh_Interval    10

# Normalize output setting short hostname:
[FILTER]
    Name                modify
    Match               *
    Set                 _HOSTNAME ${UMBREL_HOSTNAME}
# Lua
#[FILTER]
#    Name                lua
#    Match               *
#    script              /fluent-bit/etc/normalize.lua
#    call                normalize_hostname
# Set docker identitifer
[FILTER]
    Name                modify
    Match               umbrel.docker
    Set                 SYSLOG_IDENTIFIER docker

# Send everything to rsyslog
[OUTPUT]
    Name                syslog
    Match               *
    Host                ${LOG_SERVER_HOST}
    Port                ${LOG_SERVER_PORT}
    Mode                udp
    Syslog_Format       rfc5424
    Syslog_Hostname_Key _HOSTNAME
    Syslog_Appname_Key  SYSLOG_IDENTIFIER
    Syslog_Message_Key  MESSAGE
