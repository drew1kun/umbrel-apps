---
services:
  fluent-bit:
    image: docker.io/drew1kun/fluentbit:5.1.5-distroless@sha256:3392e52eb4ffb6eff2b2c2913f574acf85a1760609437b8b240fa431d73d64e2
    container_name: fluent-bit
    restart: unless-stopped
    user: root
    env_file:
      - ${APP_DATA_DIR}/.env
    environment:
      UMBREL_HOSTNAME: ${UMBREL_HOSTNAME}
      UMBREL_SEARCH_DOMAIN: ${UMBREL_SEARCH_DOMAIN:-local}
    volumes:
      - ${APP_DATA_DIR}/data/config:/fluent-bit/etc:ro
      - ${APP_DATA_DIR}/storage:/fluent-bit/storage
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
